<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Rural Bank of San Rafael</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Merriweather', serif;
        }
        .bg-brand-green { background-color: #004d00; }
        .text-brand-green { color: #004d00; }
        .text-brand-yellow { color: #f2c700; }
        .hover\:text-brand-yellow:hover { color: #f2c700; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

<header class="bg-brand-green fixed top-0 left-0 right-0 shadow-lg z-50">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between relative">
        <a href="index.html" class="flex items-center text-sm sm:text-base md:text-lg font-bold text-brand-yellow">
            <img src="277570418_377604507712528_8014509792721781536_n.jpg" class="h-9 w-9 sm:h-10 sm:w-10 mr-2 rounded-md" alt="Bank Logo">
            <span>Rural Bank of San Rafael</span>
        </a>
        <nav class="hidden md:flex space-x-4 lg:space-x-6 text-white items-center">
            <a href="index.html" class="hover:text-brand-yellow">Home</a>
            <a href="about.html" class="hover:text-brand-yellow">About</a>
            <a href="services.html" class="hover:text-brand-yellow">Services</a>
            <a href="careers.html" class="hover:text-brand-yellow">Careers</a>
            <a href="contact.html" class="hover:text-brand-yellow">Contact</a>
            <a href="login.html" class="hover:text-brand-yellow" data-auth-link>Login</a>
        </nav>
        <button id="mobile-menu-button" type="button" class="md:hidden rounded-lg border border-white/30 p-2 text-white focus:outline-none" aria-label="Toggle menu">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden absolute left-0 right-0 top-full bg-brand-green border-t border-white/20 px-4 py-4 space-y-2 shadow-lg">
        <a href="index.html" class="block rounded-lg px-3 py-2 text-white hover:bg-white/10">Home</a>
        <a href="about.html" class="block rounded-lg px-3 py-2 text-white hover:bg-white/10">About</a>
        <a href="services.html" class="block rounded-lg px-3 py-2 text-white hover:bg-white/10">Services</a>
        <a href="careers.html" class="block rounded-lg px-3 py-2 text-white hover:bg-white/10">Careers</a>
        <a href="contact.html" class="block rounded-lg px-3 py-2 text-white hover:bg-white/10">Contact</a>
        <a href="login.html" class="block rounded-lg px-3 py-2 text-white hover:bg-white/10" data-auth-link>Login</a>
    </div>
</header>

<main class="pt-28 pb-16 px-4">
    <section class="max-w-xl mx-auto">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
            <div class="bg-brand-green px-8 py-10 text-white">
                <h1 class="text-3xl md:text-4xl font-black mb-3">Change Password</h1>
                <p class="text-green-100">Update your account password. You must enter your current password to continue.</p>
                <p id="signed-in-as" class="mt-4 text-sm text-green-200"></p>
            </div>
            <div class="p-8 md:p-10">
                <form id="change-password-form" class="space-y-5">
                    <div>
                        <label for="current-password" class="block text-sm font-semibold text-gray-700 mb-2">Current Password</label>
                        <input id="current-password" name="current-password" type="password" required autocomplete="current-password" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Enter current password">
                    </div>
                    <div>
                        <label for="new-password" class="block text-sm font-semibold text-gray-700 mb-2">New Password</label>
                        <input id="new-password" name="new-password" type="password" required minlength="8" autocomplete="new-password" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-400" placeholder="At least 8 characters">
                    </div>
                    <div>
                        <label for="confirm-password" class="block text-sm font-semibold text-gray-700 mb-2">Confirm New Password</label>
                        <input id="confirm-password" name="confirm-password" type="password" required minlength="8" autocomplete="new-password" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Re-enter new password">
                    </div>
                    <p id="change-password-message" class="text-sm text-gray-600"></p>
                    <div class="flex flex-wrap gap-3">
                        <button type="submit" class="rounded-xl bg-brand-green px-5 py-3 font-bold text-white hover:bg-green-800 transition">Update Password</button>
                        <a id="back-link" href="index.html" class="rounded-xl border border-gray-300 px-5 py-3 font-bold text-gray-700 hover:bg-gray-100 transition">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<footer class="bg-brand-green text-white py-8 text-center mt-12">
    <p class="opacity-75">© 2026 Rural Bank of San Rafael. All Rights Reserved.</p>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import { getFirestore, collection, getDocs, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    window.rbsrFirebase = {
        app,
        analytics,
        db,
        firebaseConfig,
        firestore: {
            collection,
            getDocs,
            doc,
            setDoc,
            serverTimestamp
        }
    };
</script>
<script src="auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const form = document.getElementById('change-password-form');
        const message = document.getElementById('change-password-message');
        const signedInAs = document.getElementById('signed-in-as');
        const backLink = document.getElementById('back-link');

        if (mobileMenuButton && mobileMenu) {
            mobileMenuButton.addEventListener('click', function () {
                mobileMenu.classList.toggle('hidden');
            });
        }

        if (!window.rbsrAuth || !window.rbsrAuth.isLoggedIn()) {
            window.location.href = 'login.html';
            return;
        }

        const currentUser = window.rbsrAuth.getCurrentUser();
        if (signedInAs) {
            signedInAs.textContent = 'Signed in as ' + (currentUser.username || 'User');
        }

        if (window.rbsrAuth.isAdmin && window.rbsrAuth.isAdmin()) {
            backLink.href = 'admin.html';
        } else if (window.rbsrAuth.hasPermission('careers')) {
            backLink.href = 'careers.html';
        } else if (window.rbsrAuth.hasPermission('properties')) {
            backLink.href = 'real-and-other-properties-acquired.html';
        }

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            message.textContent = '';
            message.className = 'text-sm text-gray-600';

            if (newPassword !== confirmPassword) {
                message.textContent = 'New password and confirmation do not match.';
                message.className = 'text-sm text-red-600';
                return;
            }

            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Updating...';

            try {
                const result = await window.rbsrAuth.changePassword(currentPassword, newPassword);
                if (result.success) {
                    message.textContent = result.message;
                    message.className = 'text-sm text-green-700 font-semibold';
                    form.reset();
                } else {
                    message.textContent = result.message;
                    message.className = 'text-sm text-red-600';
                }
            } catch (error) {
                console.error('Password change failed:', error);
                message.textContent = 'Something went wrong. Please try again.';
                message.className = 'text-sm text-red-600';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Update Password';
            }
        });
    });
</script>
</body>
</html>
